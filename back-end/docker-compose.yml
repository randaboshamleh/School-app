services:
  # PHP-FPM (Laravel App)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_app
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: school_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: school_db
    restart: always
    environment:
      MYSQL_DATABASE: school_db
      MYSQL_USER: schooluser
      MYSQL_PASSWORD: schoolpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Redis (للكاش والـ Queue)
  redis:
    image: redis:alpine
    container_name: school_redis
    ports:
      - "6379:6379"

  # Worker (Laravel Queue)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  db_data:
